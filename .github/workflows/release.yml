name: Release

# Publishes stroebs/rustdesk-web to Docker Hub when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# produces the tags 0.2.0, 0.2 and latest (latest is skipped for pre-releases such as v0.3.0-rc.1).
#
# Required repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub
# access token with Read & Write scope).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: stroebs/rustdesk-web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($pkg). Bump package.json first."
            exit 1
          fi
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the published image on both platforms
        run: |
          for platform in linux/amd64 linux/arm64; do
            name="smoke-${platform##*/}"
            docker run -d --name "$name" --platform "$platform" -e ADMIN_PASSWORD=ci-smoke-test \
              "${IMAGE}:${{ steps.meta.outputs.version }}"
            for i in $(seq 1 30); do
              if docker exec "$name" wget -qO- http://127.0.0.1:21114/api/health; then echo " <- $platform ok"; break; fi
              [ "$i" = 30 ] && { docker logs "$name"; exit 1; }
              sleep 2
            done
            docker rm -f "$name"
          done
