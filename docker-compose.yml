# A complete RustDesk OSS server with the web admin console.
#
#   docker compose up -d
#   docker compose logs rustdesk-web    # shows the generated admin password on first start
#
# Then open http://<host>:21114 and, in each RustDesk client, set
#   ID server:  <host>
#   API server: http://<host>:21114     (use https behind a reverse proxy)
#   Key:        shown under Settings in the console

services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: hbbs
    command: hbbs
    volumes:
      - ./hbbs-data:/root
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: hbbr
    command: hbbr
    volumes:
      - ./hbbs-data:/root
    ports:
      - "21117:21117"
      - "21119:21119"
    restart: unless-stopped

  rustdesk-web:
    build: .
    container_name: rustdesk-web
    environment:
      # ADMIN_PASSWORD: change-me          # otherwise a random one is printed in the logs
      HBBS_DB_PATH: /hbbs/db_v2.sqlite3
      HBBS_KEY_FILE: /hbbs/id_ed25519.pub
      # ID_SERVER: rustdesk.example.com    # defaults for Settings > Client configuration
      # API_SERVER: https://rustdesk.example.com
      # TRUST_PROXY: "true"                # when behind a reverse proxy
    volumes:
      - ./web-data:/data
      # Mount the whole hbbs directory (not just the file) so SQLite can see the WAL files.
      - ./hbbs-data:/hbbs:ro
    ports:
      - "21114:21114"
    depends_on:
      - hbbs
    restart: unless-stopped
